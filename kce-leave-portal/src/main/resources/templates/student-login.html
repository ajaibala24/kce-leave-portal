<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" th:href="@{/css/style.css}"><script th:src="@{/js/app.js}" defer></script><title>Student Login</title></head><body>
<div th:replace="~{fragments :: header}"></div>
<div class="container"><div class="card narrow">
  <h2 class="title">🎓 Student Login</h2><p class="sub">Use your name and register number.</p>
  <div class="error" th:if="${error}" th:text="${error}"></div>
  <form th:action="@{/student/login}" method="post">
    <label>Username (Your Name)</label><input name="username" placeholder="e.g. Aathish" required autofocus>
    <label>Password (Register No)</label><input type="password" name="password" placeholder="e.g. 25csa01" required>
    <button class="btn gold" type="submit">Login</button>
  </form>
</div></div>
<footer th:replace="~{fragments :: footer}"></footer></body></html>

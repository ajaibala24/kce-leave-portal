<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" th:href="@{/css/style.css}"><script th:src="@{/js/app.js}" defer></script><title>Class Teacher Login</title></head><body>
<div th:replace="~{fragments :: header}"></div>
<div class="container"><div class="card narrow">
  <h2 class="title">👨‍🏫 Class Teacher Login</h2><p class="sub">Enter your class and password.</p>
  <div class="error" th:if="${error}" th:text="${error}"></div>
  <form th:action="@{/teacher/login}" method="post">
    <label>Class</label><input name="className" placeholder="e.g. II-CSE-A" required autofocus>
    <label>Password</label><input type="password" name="password" required>
    <button class="btn" type="submit">Login</button>
  </form>
</div></div>
<footer th:replace="~{fragments :: footer}"></footer></body></html>
